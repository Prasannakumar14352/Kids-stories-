<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" role="img" aria-label="ProdX Store — Digital Products Marketplace">
  <defs>
    <linearGradient id="prodx-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A33" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>
  </defs>

  <g transform="skewX(-8)">
    <text x="6" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" fill="#FFFFFF">PROD</text>
    <text x="192" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="78" fill="url(#prodx-orange)">X</text>
    <text x="248" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" fill="url(#prodx-orange)">STORE</text>
