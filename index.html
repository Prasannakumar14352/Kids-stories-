    />
    <meta name="theme-color" content="#0E0F13" />
    <title>50 Kids Stories Mega Bundle | ProdX Store</title>

    <!-- Preconnect to Google Fonts for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Meta Pixel -->
    <script>
      // Paste your Meta / Facebook Pixel ID here. Leave empty to skip firing (no errors).
      window.META_PIXEL_ID = "META_PIXEL_ID";

      (function (id) {
        if (!id) return;
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(
          window,
          document,
          "script",
          "https://connect.facebook.net/en_US/fbevents.js"
        );
        fbq("init", id);
        fbq("track", "PageView");
      })(window.META_PIXEL_ID);
    </script>
  </head>
  <body class="bg-white font-body text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
